<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Barcode Reader with Snapshot Preview</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 20px;
      }
      video {
        width: 100%;
        max-height: 60vh;
        background: #000;
        border-radius: 8px;
      }
      img#snapshot {
        width: 100%;
        max-height: 60vh;
        display: none;
        border-radius: 8px;
        margin-top: 10px;
      }
      canvas {
        display: none;
      }
      .controls {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .result {
        margin-top: 10px;
        padding: 10px;
        border-radius: 6px;
        background: #f3f3f3;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
        background: #fff;
      }
      select,
      input[type="file"] {
        padding: 6px;
      }
      #overlay {
        border: 3px dashed rgba(0, 255, 0, 0.6);
        width: 60%;
        height: 40%;
        top: 30%;
        left: 20%;
        position: absolute;
      }

      .video-wrap {
        position: relative;
      }
    </style>
  </head>
  <body>
    <h2>📸 Barcode / QR Reader with “Take Picture” Mode</h2>

    <div class="video-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div id="overlay"></div>
    </div>

    <img id="snapshot" alt="Captured snapshot preview" />

    <div class="controls">
      <select id="deviceSelect"></select>
      <button id="startBtn">Start camera</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="snapBtn" disabled>📸 Take picture</button>
      <label
        ><input id="fileInput" type="file" accept="image/*" /> Upload
        image</label
      >
      <span id="status">Status: idle</span>
    </div>

    <div id="result" class="result">No barcode detected yet.</div>

    <canvas id="canvas"></canvas>

    <!-- Use the latest ZXing browser module -->
    <script type="module">
      import { BrowserMultiFormatReader } from "https://unpkg.com/@zxing/browser@latest?module";

      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const snapBtn = document.getElementById("snapBtn");
      const fileInput = document.getElementById("fileInput");
      const deviceSelect = document.getElementById("deviceSelect");
      const resultEl = document.getElementById("result");
      const statusEl = document.getElementById("status");
      const snapshotImg = document.getElementById("snapshot");

      let stream = null;
      const preferredFormats = [
        "qr_code",
        "ean_13",
        "code_128",
        "code_39",
        "upc_a",
      ];

      function setStatus(t) {
        statusEl.textContent = "Status: " + t;
      }
      function showResult(text) {
        resultEl.innerHTML = "<strong>Detected:</strong> " + text;
      }

      async function listDevices() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const vids = devices.filter((d) => d.kind === "videoinput");
        deviceSelect.innerHTML = "";
        vids.forEach((d, i) => {
          const opt = document.createElement("option");
          opt.value = d.deviceId;
          opt.text = d.label || "Camera " + (i + 1);
          deviceSelect.appendChild(opt);
        });
      }

      async function startCamera(id) {
        stopCamera();
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            deviceId: id ? { exact: id } : undefined,
            facingMode: "environment",
            width: { ideal: 2560 },
            height: { ideal: 1440 },
            focusMode: "manual",
            advanced: [
              { focusMode: "continuous" },
              { torch: false },
              { exposureMode: "manual" },
            ],
          },
        });

        video.srcObject = stream;
        await video.play();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        snapBtn.disabled = false;
        snapshotImg.style.display = "none";
        setStatus("camera running");
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        video.srcObject = null;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        snapBtn.disabled = true;
        setStatus("stopped");
      }
      function sharpen(ctx, w, h) {
        const weights = [0, -1, 0, -1, 5, -1, 0, -1, 0];
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const copy = new Uint8ClampedArray(data);
        const side = Math.round(Math.sqrt(weights.length));
        const half = Math.floor(side / 2);

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            let r = 0,
              g = 0,
              b = 0;
            for (let cy = 0; cy < side; cy++) {
              for (let cx = 0; cx < side; cx++) {
                const scy = y + cy - half;
                const scx = x + cx - half;
                if (scy >= 0 && scy < h && scx >= 0 && scx < w) {
                  const srcOff = (scy * w + scx) * 4;
                  const wt = weights[cy * side + cx];
                  r += copy[srcOff] * wt;
                  g += copy[srcOff + 1] * wt;
                  b += copy[srcOff + 2] * wt;
                }
              }
            }
            const dstOff = (y * w + x) * 4;
            data[dstOff] = r;
            data[dstOff + 1] = g;
            data[dstOff + 2] = b;
          }
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // 📸 Take still picture & analyze once
      async function takeSnapshot() {
        if (!video.videoWidth) return;
        setStatus("taking picture...");
        // Draw current frame to canvas
        console.log(
          `video.videoWidth: ${video.videoWidth}, video.videoHeight: ${video.videoHeight}`
        );
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        const scale = 2; // upscale
        const w = video.videoWidth;
        const h = video.videoHeight;
        canvas.width = w * scale;
        canvas.height = h * scale;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        sharpen(ctx, canvas.width, canvas.height);

        // Show captured image
        // Enhance contrast and sharpness
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        // Simple unsharp mask
        for (let i = 0; i < data.length; i += 4) {
          // Convert to grayscale for quick local contrast boost
          const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
          const factor = 1.3; // increase contrast
          data[i] = Math.min(255, avg * factor);
          data[i + 1] = Math.min(255, avg * factor);
          data[i + 2] = Math.min(255, avg * factor);
        }
        ctx.putImageData(imageData, 0, 0);
        sharpen(ctx, canvas.width, canvas.height);

        snapshotImg.src = canvas.toDataURL("image/png");
        snapshotImg.style.display = "block";

        setStatus("analyzing snapshot...");
        // Try native BarcodeDetector
        if ("BarcodeDetector" in window) {
          try {
            const detector = new BarcodeDetector({
              formats: preferredFormats,
            });
            const codes = await detector.detect(canvas);
            if (codes.length) {
              showResult(codes[0].rawValue);
              setStatus("found barcode (native)");
              return;
            }
          } catch (e) {
            console.warn("BarcodeDetector error", e);
          }
        }

        // Fallback ZXing (latest) - decode from snapshot image
        try {
          const reader = new BrowserMultiFormatReader();
          if (snapshotImg.complete && snapshotImg.naturalWidth !== 0) {
            const result = await reader.decodeFromImageElement(snapshotImg);
            if (result && result.text) {
              showResult(result.text);
              setStatus("found barcode (ZXing)");
              return;
            }
          } else {
            snapshotImg.onload = async () => {
              try {
                const result = await reader.decodeFromImageElement(snapshotImg);
                if (result && result.text) {
                  showResult(result.text);
                  setStatus("found barcode (ZXing)");
                }
              } catch (e) {
                setStatus(
                  "ZXing decode error: " + (e && e.message ? e.message : e)
                );
                console.warn("ZXing decode error", e);
              }
            };
          }
        } catch (e) {
          setStatus("ZXing decode error: " + (e && e.message ? e.message : e));
          console.warn("ZXing decode error", e);
        }

        setStatus("no barcode found in picture");
        resultEl.textContent = "No barcode found in picture.";
      }
      // Decode uploaded image
      fileInput.addEventListener("change", async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const img = new Image();
        img.onload = async () => {
          // Show the uploaded image in the snapshot image tag
          snapshotImg.src = img.src;
          snapshotImg.style.display = "block";
          // Try to detect barcode from the uploaded image
          setStatus("analyzing uploaded image...");
          try {
            const reader = new BrowserMultiFormatReader();
            const result = await reader.decodeFromImageElement(snapshotImg);
            if (result && result.text) {
              showResult(result.text);
              setStatus("found barcode (ZXing)");
              return;
            } else {
              setStatus("no barcode found in uploaded image");
              resultEl.textContent = "No barcode found in uploaded image.";
            }
          } catch (e) {
            setStatus(
              "ZXing decode error: " + (e && e.message ? e.message : e)
            );
            console.warn("ZXing decode error", e);
            resultEl.textContent = "No barcode found in uploaded image.";
          }
        };
        const r = new FileReader();
        r.onload = () => (img.src = r.result);
        r.readAsDataURL(f);
      });

      startBtn.onclick = () => startCamera(deviceSelect.value);
      stopBtn.onclick = () => stopCamera();
      snapBtn.onclick = async () => {
        setStatus("waiting for autofocus...");
        await new Promise((r) => setTimeout(r, 800));
        takeSnapshot();
      };

      listDevices();
      setStatus("ready");
    </script>
  </body>
</html>
